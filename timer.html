<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Timer</title>
        <link rel="icon" type="icon/x-icon" href="assets/icon.ico">
        <meta property="og:title" content="DrSkillful's Timer" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://oldnetdeckbuilder.netlify.app/timer.html" />
        <meta property="og:image" content="https://oldnetdeckbuilder.netlify.app/assets/thumb2.png" />
        <meta property="og:description" content="A timer for all your LGS or play at home sessions for Cyberpunk TCG, Magic; The Gathering, Yu-Gi-Oh, One Piece TCG and even Riftbound" />
        <meta name="theme-color" content="#fee801">
        <meta name="og:card" content="summary_large_image">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="timer1">
        <h1>DrSkillful's TCG Time Tracker</h1>
        <a href="index.html">Back to front page</a><br><br>
        <div id="Timer">
            <h1 id="ten-countdown"></h1>
            <button onclick='countdown("ten-countdown", 30, 0 ,"C");' id="CTCGBO1">Cyberpunk TCG BO1</button>
            <button onclick='countdown("ten-countdown", 50, 0, "C");' id="CTCGBO3">Cyberpunk TCG BO3</button>
            <button onclick='countdown("ten-countdown", 50, 0, "M");' id="MTGBO3">Magic The Gathering BO3</button>
            <button onclick='countdown("ten-countdown", 30, 0, "OP");' id="OPBO1">One Piece TCG BO1</button>
            <button onclick='countdown("ten-countdown", 60, 0, "OP" );' id="OPBO3">One Piece TCG BO3</button>
            <button onclick='countdown("ten-countdown", 60, 0, "RB" );' id="RBBO3">Riftbound BO3</button>
        </div>
        <script src="timeTrack.js"></script>
    </body>
</html>
